<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>944S · G-Force</title>
<style>
  /* Keep in sync with clock.html so both sit identically in the bezel */
  :root { --fit: 94; --nudge-x: -10px; --nudge-y: 12px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #wrap { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }
  canvas { width: min(calc(var(--fit)*1vw), calc(var(--fit)*1vh));
           height: min(calc(var(--fit)*1vw), calc(var(--fit)*1vh));
           display: block; position: relative; left: var(--nudge-x); top: var(--nudge-y); }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
/* ─────────────────────────────────────────────────────────────
   944S G-meter — side-profile silhouette attitude display.

   A line-art 944 profile (traced from the classic silhouette: wedge nose,
   pop-up headlight bulge, fastback hatch, ducktail, phone-dial wheels,
   PORSCHE rocker script) pitches with longitudinal G over a fixed teal
   ground datum, and slides with speed-lines under lateral G. Big combined-G
   number + LEAN/PITCH shelf below, PK on top.

   Canvas 2D, no WebGL (this Pi's V3D is flaky and the car is offline).
   Drawn in a 1000x1000 design space. Add ?fps=1 for a frame-rate readout.
   ───────────────────────────────────────────────────────────── */
(function () {
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d"), K = 1;
  var C = { vfd:"#2ce8d8", vfdHi:"#8ffff2", amber:"#ffb000", ice:"#5cb8ff",
            red:"#ff3b30", text:"#eaf6f4", mid:"#8ea6a3" };
  var S = 0.88, GROUND = 600, GY = GROUND - 80 * S;
  var showFps = location.search.indexOf("fps") >= 0;

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
    if (w && h) { cv.width = w; cv.height = h; K = w / 1000; }
  }
  window.addEventListener("resize", resize);

  // ── the car (local coords: x 0=nose..946=tail, y negative = up, 0 = ground) ──
  function body(c) {
    c.beginPath();
    c.moveTo(6,-34); c.lineTo(0,-50);
    c.quadraticCurveTo(4,-62,16,-64);        // nose tip
    c.quadraticCurveTo(70,-76,112,-86);      // hood
    c.quadraticCurveTo(150,-95,192,-92);     // pop-up headlight bulge
    c.quadraticCurveTo(255,-97,320,-105);    // cowl
    c.lineTo(452,-186);                      // windshield / A-pillar
    c.quadraticCurveTo(510,-206,566,-204);   // roof
    c.quadraticCurveTo(650,-194,706,-170);   // fastback upper
    c.quadraticCurveTo(788,-136,842,-124);   // hatch glass to deck
    c.quadraticCurveTo(876,-130,898,-131);   // ducktail kick
    c.lineTo(906,-114);
    c.quadraticCurveTo(922,-98,944,-90);     // tail upper
    c.lineTo(946,-56);                       // bumper face
    c.quadraticCurveTo(944,-38,916,-34);
    c.lineTo(884,-30); c.lineTo(877,-30);
    var i, th;
    for (i = 0; i <= 12; i++) { th = Math.PI*i/12; c.lineTo(793+84*Math.cos(th), -30-84*Math.sin(th)); }  // rear arch
    c.lineTo(320,-30);                       // rocker
    for (i = 0; i <= 12; i++) { th = Math.PI*i/12; c.lineTo(236+84*Math.cos(th), -30-84*Math.sin(th)); }  // front arch
    c.lineTo(60,-30);
    c.quadraticCurveTo(24,-30,6,-34);        // front valance
    c.stroke();
  }
  function details(c) {
    c.beginPath();
    c.moveTo(332,-104); c.quadraticCurveTo(500,-112,662,-114);  // beltline
    c.moveTo(344,-110); c.lineTo(456,-180);                     // DLO
    c.quadraticCurveTo(540,-194,604,-186);
    c.quadraticCurveTo(650,-166,676,-146);
    c.quadraticCurveTo(668,-124,660,-116);
    c.moveTo(578,-188); c.lineTo(586,-112);                     // B-pillar
    c.moveTo(590,-108); c.quadraticCurveTo(596,-70,588,-30);    // door shut
    c.moveTo(600,-98);  c.lineTo(626,-100);                     // handle
    c.moveTo(128,-88);  c.lineTo(198,-91);                      // headlight seam
    c.moveTo(66,-44);   c.lineTo(104,-46);                      // side marker
    c.moveTo(908,-96);  c.lineTo(940,-84);                      // tail band
    c.moveTo(884,-22);  c.lineTo(908,-22);                      // exhaust
    c.moveTo(838,-118); c.lineTo(892,-117);                     // spoiler underline
    c.stroke();
    c.beginPath(); c.moveTo(446,-126); c.lineTo(434,-142);      // mirror
    c.lineTo(454,-146); c.lineTo(460,-130); c.closePath(); c.fill();
  }
  function wheel(c, cx) {
    c.lineWidth = 3.4; c.beginPath(); c.arc(cx,-54,54,0,6.2832); c.stroke();
    c.lineWidth = 2.4; c.beginPath(); c.arc(cx,-54,34,0,6.2832); c.stroke();
    c.beginPath(); c.arc(cx,-54,6,0,6.2832); c.fill();
    c.lineWidth = 1.8;
    for (var k = 0; k < 5; k++) { var a = k*1.2566+0.6;
      c.beginPath(); c.arc(cx+21*Math.cos(a), -54+21*Math.sin(a), 7, 0, 6.2832); c.stroke(); }
  }

  // ── live data (backend) with simulated fallback ────────────
  var live = false, gLat = 0, gLon = 0;
  try {
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    var ws = new WebSocket(proto + "//" + location.host + "/ws");
    ws.onmessage = function (ev) {
      try { var s = JSON.parse(ev.data);
        if (s.g_lateral !== undefined && s.g_longitudinal !== undefined) {
          live = true; gLat = s.g_lateral; gLon = s.g_longitudinal; }
      } catch (e) {}
    };
  } catch (e) {}

  var wp = [[0,0,0.05],[1.4,0,-1.10],[2.9,0.95,-0.35],[4.3,1.02,0.15],[5.7,0.30,0.70],
            [6.6,0,0.15],[7.2,0,-1.05],[8.6,-0.98,-0.30],[10.0,-1.04,0.15],[11.4,-0.28,0.68],[12.0,0,0.05]];
  function sm(a,b,t){ t = t*t*(3-2*t); return a + (b-a)*t; }
  function sample(tt) {
    for (var i = 0; i < wp.length-1; i++)
      if (tt >= wp[i][0] && tt <= wp[i+1][0]) {
        var f = (tt - wp[i][0]) / (wp[i+1][0] - wp[i][0]);
        return [sm(wp[i][1],wp[i+1][1],f), sm(wp[i][2],wp[i+1][2],f)];
      }
    return [0,0];
  }

  var peak = 0, peakT = 0, t0 = performance.now(), fps = 0, fAcc = 0, fN = 0, fT = t0;

  function frame(now) {
    if (!cv.width) resize();
    var lat, lon;
    if (live) { lat = gLat; lon = gLon; }
    else { var g = sample(((now - t0)/1000) % 12);
           lat = g[0] + (Math.random()-0.5)*0.02;
           lon = g[1] + (Math.random()-0.5)*0.02; }

    var mag = Math.sqrt(lat*lat + lon*lon);
    if (mag > peak) { peak = mag; peakT = now; }
    if (now - peakT > 2600) peak = Math.max(mag, peak - 0.004);

    ctx.setTransform(K, 0, 0, K, 0, 0);
    ctx.clearRect(0, 0, 1000, 1000);
    ctx.save();
    ctx.beginPath(); ctx.arc(500, 500, 452, 0, 6.2832); ctx.clip();

    var fg = ctx.createRadialGradient(500, 430, 40, 500, 500, 452);
    fg.addColorStop(0, "#0d1014"); fg.addColorStop(0.62, "#080a0d"); fg.addColorStop(1, "#020304");
    ctx.fillStyle = fg; ctx.fillRect(0, 0, 1000, 1000);

    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.letterSpacing = "13px";
    ctx.font = "700 30px system-ui,'Helvetica Neue',Arial,sans-serif";
    ctx.fillStyle = "#d9dde1"; ctx.globalAlpha = 0.85; ctx.fillText("PORSCHE", 506, 310); ctx.globalAlpha = 1;
    ctx.letterSpacing = "0px";
    ctx.font = "bold 28px ui-monospace, Menlo, monospace";
    ctx.fillStyle = C.amber; ctx.fillText("PK " + peak.toFixed(2), 500, 100);

    // ground datum
    ctx.strokeStyle = C.vfd; ctx.globalAlpha = 0.12; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(120, GROUND); ctx.lineTo(880, GROUND); ctx.stroke();
    ctx.globalAlpha = 0.9; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(120, GROUND); ctx.lineTo(880, GROUND); ctx.stroke();
    ctx.globalAlpha = 0.35; ctx.lineWidth = 2; ctx.beginPath();
    for (var i = 0; i <= 16; i++) { ctx.moveTo(140+i*45, GROUND); ctx.lineTo(140+i*45, GROUND+10); }
    ctx.stroke(); ctx.globalAlpha = 1;

    // lateral speed-lines
    if (Math.abs(lat) > 0.28) {
      var dir = lat > 0 ? 1 : -1, len = 50 + Math.abs(lat)*70;
      ctx.strokeStyle = C.vfd; ctx.globalAlpha = 0.25 + 0.35*Math.min(1, Math.abs(lat)); ctx.lineWidth = 3;
      ctx.beginPath();
      for (var s2 = 0; s2 < 3; s2++) { var yy = 452+s2*34, x0 = dir > 0 ? 150 : 850;
        ctx.moveTo(x0, yy); ctx.lineTo(x0+dir*len, yy); }
      ctx.stroke(); ctx.globalAlpha = 1;
    }

    // the car — pitches with lon G (nose dives under braking), slides with lat G
    var th = 0.35*Math.atan(lon), slide = lat*40;
    ctx.save();
    ctx.translate(500+slide, GY); ctx.rotate(th); ctx.scale(S, S); ctx.translate(-480, 80);
    ctx.strokeStyle = C.text; ctx.fillStyle = C.text; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.lineWidth = 3.4; body(ctx);
    ctx.lineWidth = 2.2; details(ctx);
    wheel(ctx, 236); wheel(ctx, 793);
    ctx.letterSpacing = "10px";
    ctx.font = "700 28px system-ui,'Helvetica Neue',Arial,sans-serif";
    ctx.globalAlpha = 0.9; ctx.textAlign = "center"; ctx.fillText("PORSCHE", 505, -40); ctx.globalAlpha = 1;
    ctx.letterSpacing = "0px";
    ctx.restore();

    // data shelf
    ctx.strokeStyle = "#1c2429"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(215, 762); ctx.lineTo(785, 762); ctx.stroke();
    ctx.font = "bold 22px system-ui,'Helvetica Neue',Arial,sans-serif";
    ctx.fillStyle = C.mid; ctx.fillText("LEAN", 285, 796); ctx.fillText("PITCH", 715, 796);
    ctx.fillStyle = "#5d6f74"; ctx.fillText("G-FORCE", 500, 796);
    var rd = Math.atan(lat)*57.2958, pd = Math.atan(lon)*57.2958;
    ctx.font = "bold 40px ui-monospace, Menlo, 'DejaVu Sans Mono', monospace";
    ctx.fillStyle = C.ice; ctx.fillText((rd >= 0 ? "R" : "L") + Math.abs(rd).toFixed(0) + "°", 285, 852);
    ctx.fillStyle = C.red; ctx.fillText((pd >= 0 ? "+" : "−") + Math.abs(pd).toFixed(0) + "°", 715, 852);
    ctx.font = "bold 106px ui-monospace, Menlo, 'DejaVu Sans Mono', monospace";
    ctx.fillStyle = C.text; ctx.textBaseline = "middle"; ctx.fillText(mag.toFixed(2), 500, 872);
    ctx.textBaseline = "alphabetic";

    if (showFps) {
      fAcc += now - fT; fT = now; fN++;
      if (fAcc >= 500) { fps = Math.round(1000 / (fAcc / fN)); fAcc = 0; fN = 0; }
      ctx.font = "bold 26px ui-monospace, monospace"; ctx.fillStyle = "#3aff8c";
      ctx.textAlign = "left"; ctx.fillText(fps + " FPS", 232, 700); ctx.textAlign = "center";
    }
    ctx.restore();

    // bezel
    var bg = ctx.createLinearGradient(0, 40, 0, 960);
    bg.addColorStop(0, "#e9edf0"); bg.addColorStop(0.18, "#a7adb4");
    bg.addColorStop(0.5, "#4c5157"); bg.addColorStop(0.82, "#9aa0a7"); bg.addColorStop(1, "#d7dbdf");
    ctx.lineWidth = 34; ctx.strokeStyle = bg;
    ctx.beginPath(); ctx.arc(500, 500, 478, 0, 6.2832); ctx.stroke();
    ctx.lineWidth = 10; ctx.strokeStyle = "#14171b";
    ctx.beginPath(); ctx.arc(500, 500, 457, 0, 6.2832); ctx.stroke();

    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
