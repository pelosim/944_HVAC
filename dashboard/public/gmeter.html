<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>944S · G-Force</title>
<style>
  /* Keep in sync with clock.html so both sit identically in the bezel */
  :root { --fit: 94; --nudge-x: -10px; --nudge-y: 12px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #wrap { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }
  canvas { width: min(calc(var(--fit)*1vw), calc(var(--fit)*1vh));
           height: min(calc(var(--fit)*1vw), calc(var(--fit)*1vh));
           display: block; position: relative; left: var(--nudge-x); top: var(--nudge-y); }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
/* ─────────────────────────────────────────────────────────────
   944S G-meter — peak-hold display, Porsche/GM style.

   Fixed amber centre dot is the datum; the whole teal ring floats around
   it (opposite the G vector), carrying its own tick dots. A bigger moving
   element reads better peripherally than a small travelling dot. Four
   session maxima sit in a diamond around it; live magnitude below.

   Styled to the HVAC dashboard: phosphor teal, amber peaks, and the header
   rendered as the same tinted/bordered window as the mode annunciator.

   Canvas 2D, no WebGL (Pi V3D is flaky, the car is offline).
   1000x1000 design space. ?fps=1 shows a frame-rate readout.
   ───────────────────────────────────────────────────────────── */
(function () {
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d"), K = 1;
  var C = { vfd:"#2ce8d8", vfdHi:"#8ffff2", amber:"#ffb000", amberHi:"#ffd76a",
            ice:"#5cb8ff", text:"#eaf6f4", mid:"#8ea6a3", dim:"#46565a" };
  var CX = 500, CY = 500, RC = 110, SC = 55, MAXT = 80;
  var showFps = location.search.indexOf("fps") >= 0;

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
    if (w && h) { cv.width = w; cv.height = h; K = w / 1000; }
  }
  window.addEventListener("resize", resize);

  function glowText(t, x, y, font, color, blur, align) {
    ctx.font = font; ctx.textAlign = align || "center";
    ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.fillStyle = color;
    ctx.fillText(t, x, y); ctx.shadowBlur = 0;
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  }

  // ── live data (backend) with simulated fallback ────────────
  var live = false, gLat = 0, gLon = 0;
  try {
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    var ws = new WebSocket(proto + "//" + location.host + "/ws");
    ws.onmessage = function (ev) {
      try { var s = JSON.parse(ev.data);
        if (s.g_lateral !== undefined && s.g_longitudinal !== undefined) {
          live = true; gLat = s.g_lateral; gLon = s.g_longitudinal; }
      } catch (e) {}
    };
  } catch (e) {}

  var wp = [[0,0,0.05],[1.4,0,-1.10],[2.9,0.95,-0.35],[4.3,1.02,0.15],[5.7,0.30,0.70],
            [6.6,0,0.15],[7.2,0,-1.05],[8.6,-0.98,-0.30],[10.0,-1.04,0.15],[11.4,-0.28,0.68],[12.0,0,0.05]];
  function sm(a,b,t){ t = t*t*(3-2*t); return a + (b-a)*t; }
  function sample(tt) {
    for (var i = 0; i < wp.length-1; i++)
      if (tt >= wp[i][0] && tt <= wp[i+1][0]) {
        var f = (tt - wp[i][0]) / (wp[i+1][0] - wp[i][0]);
        return [sm(wp[i][1],wp[i+1][1],f), sm(wp[i][2],wp[i+1][2],f)];
      }
    return [0,0];
  }

  var mAcc = 0, mBrk = 0, mLft = 0, mRgt = 0;
  var t0 = performance.now(), fps = 0, fAcc = 0, fN = 0, fT = t0;

  function frame(now) {
    if (!cv.width) resize();
    var lat, lon;
    if (live) { lat = gLat; lon = gLon; }
    else { var g = sample(((now - t0)/1000) % 12);
           lat = g[0] + (Math.random()-0.5)*0.02;
           lon = g[1] + (Math.random()-0.5)*0.02; }

    if (lon > 0) mAcc = Math.max(mAcc, lon); else mBrk = Math.max(mBrk, -lon);
    if (lat > 0) mRgt = Math.max(mRgt, lat); else mLft = Math.max(mLft, -lat);

    ctx.setTransform(K, 0, 0, K, 0, 0);
    ctx.clearRect(0, 0, 1000, 1000);
    ctx.save();
    ctx.beginPath(); ctx.arc(500, 500, 452, 0, 6.2832); ctx.clip();

    var fg = ctx.createRadialGradient(500, 430, 40, 500, 500, 452);
    fg.addColorStop(0, "#0d1014"); fg.addColorStop(0.62, "#080a0d"); fg.addColorStop(1, "#020304");
    ctx.fillStyle = fg; ctx.fillRect(0, 0, 1000, 1000);
    ctx.textBaseline = "alphabetic";

    // header window — same treatment as the dashboard's mode annunciator
    ctx.strokeStyle = "rgba(44,232,216,0.42)"; ctx.lineWidth = 2;
    ctx.fillStyle = "rgba(44,232,216,0.06)";
    rr(282, 110, 436, 58, 8); ctx.fill(); ctx.stroke();
    ctx.letterSpacing = "6px";
    glowText("MAXIMUM G-FORCE", 504, 150, "700 27px system-ui,'Helvetica Neue',Arial,sans-serif", C.vfd, 10);
    ctx.letterSpacing = "0px";

    // four session maxima
    var NF = "bold 56px ui-monospace,Menlo,'DejaVu Sans Mono',monospace";
    var LF = "700 23px system-ui,'Helvetica Neue',Arial,sans-serif";
    glowText(mAcc.toFixed(2), 500, 262, NF, C.amber, 12);
    ctx.fillStyle = C.dim; ctx.font = LF; ctx.letterSpacing = "3px"; ctx.textAlign = "center";
    ctx.fillText("ACCEL", 500, 296);
    glowText(mBrk.toFixed(2), 500, 742, NF, C.amber, 12);
    ctx.fillStyle = C.dim; ctx.font = LF; ctx.fillText("BRAKE", 500, 776);
    glowText(mLft.toFixed(2), 202, 512, NF, C.amber, 12);
    ctx.fillStyle = C.dim; ctx.font = LF; ctx.fillText("LEFT", 202, 548);
    glowText(mRgt.toFixed(2), 798, 512, NF, C.amber, 12);
    ctx.fillStyle = C.dim; ctx.font = LF; ctx.fillText("RIGHT", 798, 548);
    ctx.letterSpacing = "0px";

    // ── the floating ring (moves opposite the G vector) ──
    var ox = -lat*SC, oy = lon*SC;
    var d = Math.sqrt(ox*ox + oy*oy);
    if (d > MAXT) { ox *= MAXT/d; oy *= MAXT/d; }
    var bx = CX + ox, by = CY + oy;

    var cg = ctx.createRadialGradient(bx, by-30, 10, bx, by, RC);
    cg.addColorStop(0, "rgba(44,232,216,0.10)"); cg.addColorStop(1, "rgba(44,232,216,0.03)");
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(bx, by, RC, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = C.vfd; ctx.lineWidth = 3.5;
    ctx.shadowColor = C.vfd; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(bx, by, RC, 0, 6.2832); ctx.stroke(); ctx.shadowBlur = 0;

    ctx.fillStyle = "rgba(44,232,216,0.55)";
    [30,58,86].forEach(function (r) {
      [[r,0],[-r,0],[0,r],[0,-r]].forEach(function (p) {
        ctx.beginPath(); ctx.arc(bx+p[0], by+p[1], 3.4, 0, 6.2832); ctx.fill();
      });
    });

    // fixed centre dot — the datum
    ctx.shadowColor = C.amber; ctx.shadowBlur = 18;
    ctx.fillStyle = C.amber; ctx.beginPath(); ctx.arc(CX, CY, 12, 0, 6.2832); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.amberHi; ctx.beginPath(); ctx.arc(CX-3, CY-3, 4.5, 0, 6.2832); ctx.fill();

    // live magnitude
    // "0.00" at 62px monospace is ~148 wide; place the unit clear of its right
    // edge and centre the pair (number + gap + unit) on 500.
    var mag = Math.sqrt(lat*lat + lon*lon);
    glowText(mag.toFixed(2), 483, 876, "bold 62px ui-monospace,Menlo,monospace", C.vfd, 14);
    ctx.font = "700 30px system-ui,'Helvetica Neue',Arial,sans-serif";
    ctx.fillStyle = C.mid; ctx.textAlign = "left"; ctx.fillText("G", 571, 876);
    ctx.textAlign = "center";

    if (showFps) {
      fAcc += now - fT; fT = now; fN++;
      if (fAcc >= 500) { fps = Math.round(1000 / (fAcc / fN)); fAcc = 0; fN = 0; }
      ctx.font = "bold 24px ui-monospace, monospace"; ctx.fillStyle = "#3aff8c";
      ctx.textAlign = "left"; ctx.fillText(fps + " FPS", 190, 660); ctx.textAlign = "center";
    }
    ctx.restore();

    // bezel
    var bg = ctx.createLinearGradient(0, 40, 0, 960);
    bg.addColorStop(0, "#e9edf0"); bg.addColorStop(0.18, "#a7adb4");
    bg.addColorStop(0.5, "#4c5157"); bg.addColorStop(0.82, "#9aa0a7"); bg.addColorStop(1, "#d7dbdf");
    ctx.lineWidth = 34; ctx.strokeStyle = bg;
    ctx.beginPath(); ctx.arc(500, 500, 478, 0, 6.2832); ctx.stroke();
    ctx.lineWidth = 10; ctx.strokeStyle = "#14171b";
    ctx.beginPath(); ctx.arc(500, 500, 457, 0, 6.2832); ctx.stroke();

    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
